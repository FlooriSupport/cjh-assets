<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ad variants v3</title>
<style>
@font-face{font-family:Archivo;src:url(../cover/fonts/archivo-400.ttf);font-weight:400}
@font-face{font-family:Archivo;src:url(../cover/fonts/archivo-700.ttf);font-weight:700}
@font-face{font-family:Archivo;src:url(../cover/fonts/archivo-900.ttf);font-weight:900}
:root{--ink:#1D1D1B;--paper:#F7F5F1;--accent:#EE5B2B;--bg:var(--ink);--fg:var(--paper);--band:var(--accent);--bandfg:#fff;--mute:#B5B0A6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Archivo,"Liberation Sans",Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
body.white{--bg:#FFFFFF;--fg:#111;--mute:#666;--band:#111;--bandfg:#fff}
body.black{--bg:#000;--fg:#fff;--mute:#a3a3a3;--band:#fff;--bandfg:#000}
.stage{width:100vw;height:100vh;display:flex;flex-direction:column;padding:6.2vw 6.2vw 5.2vw;position:relative;z-index:1}
/* LOCAL: the eyebrow is the place line, always first */
.eyebrow{font-weight:900;letter-spacing:.11em;font-size:2.85vw;white-space:nowrap;color:var(--accent);text-transform:uppercase;margin-bottom:2.2vw}
.eyebrow b{color:var(--fg);font-weight:900}
h1{font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.s1 h1{font-size:11.8vw}.s2 h1{font-size:10.4vw}
/* WHAT: a co-headline, not a sub-line */
.co{font-weight:800;font-size:5.9vw;line-height:1.12;letter-spacing:-.02em;margin-top:3.2vw;text-wrap:balance}
.co em{font-style:normal;color:var(--accent);display:block}
.band{margin-top:auto;background:var(--band);color:var(--bandfg);font-weight:900;font-size:3.85vw;letter-spacing:.02em;padding:2.4vw 2.6vw;line-height:1.1;text-transform:uppercase;white-space:nowrap}
.band i{font-style:normal;opacity:.5;padding:0 .7vw}
.foot{display:flex;justify-content:space-between;font-weight:700;font-size:2.9vw;letter-spacing:.09em;color:var(--mute);margin-top:2.4vw;text-transform:uppercase}
.foot b{color:var(--fg)}
/* photo options: a strip under the text, or the whole backdrop */
.strip{position:absolute;left:0;right:0;bottom:0;height:24vw;background:url(../cover/photo-group.jpg) center 60%/cover;z-index:-1;
  filter:grayscale(1) sepia(.95) saturate(2.3) hue-rotate(-24deg) contrast(1.2) brightness(.62)}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--ink) 0%,rgba(29,29,27,0) 60%)}
body.hasstrip .stage{padding-bottom:27vw} body.hasstrip .foot{display:none}
.bleed{position:absolute;inset:0;z-index:-1;background:url(../cover/photo-group.jpg) center 45%/cover;
  filter:grayscale(1) sepia(.9) saturate(2) hue-rotate(-24deg) contrast(1.15) brightness(.5)}
.bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(29,29,27,.92) 0%,rgba(29,29,27,.82) 55%,rgba(29,29,27,.94) 100%)}
</style></head>
<body class="s1">
<div class="stage">
  <div class="eyebrow" id="eyebrow">North Dallas · <b>Live &amp; in person</b> · Free</div>
  <h1 id="h1">Dallas<br><em>Service Trade</em><br>Owners</h1>
  <p class="co" id="co">Free 3-hour live AI workshop.<em>Walk out with it running.</em></p>
  <div class="band" id="band">Fri Oct 2 <i>/</i> 1–4 PM <i>/</i> North Dallas</div>
  <div class="foot" id="foot"><span><b>20 seats</b> · free</span><span>commercialjobhunter.com</span></div>
  <div class="strip" id="strip" hidden></div>
  <div class="bleed" id="bleed" hidden></div>
</div>
</body></html>
